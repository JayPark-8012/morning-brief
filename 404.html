<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 — Morning Brief</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root {
    --bg-base: #0F1115;
    --bg-elevated: #1A1D24;
    --text-primary: #F0EAE0;
    --text-secondary: #A8A29A;
    --text-tertiary: #6B6862;
    --gold: #D4A857;
    --gold-bright: #E8C078;
    --gold-glow: rgba(212, 168, 87, 0.15);
    --border: #2D3138;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Pretendard', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    line-height: 1.7;
  }
  .container {
    max-width: 480px;
    text-align: center;
  }
  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--gold);
    padding: 0.3rem 0.6rem;
    background: var(--gold-glow);
    border-radius: 3px;
    letter-spacing: 0.05em;
    display: inline-block;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    letter-spacing: -0.01em;
  }
  p {
    color: var(--text-secondary);
    margin-bottom: 2rem;
    font-size: 0.95rem;
  }
  a {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    background: var(--gold);
    color: var(--bg-base);
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  a:hover {
    background: var(--gold-bright);
    gap: 0.75rem;
  }
  .divider {
    width: 32px;
    height: 1px;
    background: var(--gold);
    margin: 2rem auto;
  }
  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
  <div class="container">
    <span class="code">[404]</span>
    <h1>이 페이지는 발견되지 않았습니다</h1>
    <p>요청하신 브리핑이 존재하지 않거나, 주소가 잘못됐을 수 있습니다.<br>홈에서 가장 최신 브리핑을 확인하세요.</p>
    <a href="/">메인으로 돌아가기 →</a>
    <div class="divider"></div>
    <div class="meta">M · Morning Brief</div>
  </div>
</body>
</html>
